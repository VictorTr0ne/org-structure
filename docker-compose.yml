services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      - PORT=3001
    expose:
      - "3001"
    restart: unless-stopped

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    ports:
      - "${CLIENT_PORT:-8080}:80"
    depends_on:
      - server
    restart: unless-stopped
